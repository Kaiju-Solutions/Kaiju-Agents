name: Publish validated package
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Unity validation runner
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/test.yml
    with:
      runner: ${{ inputs.runner }}
    secrets: inherit
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: kaiju-package-publication
      queue: max
    outputs:
      version: ${{ steps.package.outputs.version }}
      url: ${{ steps.package.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: package
        run: python Tools/publish_package.py
  consumer:
    needs: publish
    uses: ./.github/workflows/test.yml
    with:
      runner: ${{ inputs.runner }}
      smoke_url: ${{ needs.publish.outputs.url }}
    secrets: inherit
  notes:
    needs: [publish, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.publish.outputs.version }}
      INSTALL_URL: ${{ needs.publish.outputs.url }}
    steps:
      - shell: bash
        run: |
          set -eu
          printf 'Install with Unity Package Manager using this Git URL.\n\n`%s`\n' "$INSTALL_URL" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
