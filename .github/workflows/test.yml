name: Validate Kaiju Agents
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: github-hosted
      smoke_url:
        type: string
        default: ''
    secrets:
      UNITY_LICENSE_SERIAL:
        required: false
  workflow_dispatch:
    inputs:
      runner:
        description: Unity validation runner
        type: choice
        options:
          - github-hosted
          - self-hosted
        default: github-hosted
      performance:
        description: Include warmed standalone steering benchmarks
        type: boolean
        default: false
concurrency:
  group: kaiju-agents-workflows
  queue: max
permissions:
  contents: read
env:
  UNITY_NON_INTERACTIVE: "1"
jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner == 'self-hosted' && '["self-hosted","Windows","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 240
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        editor: ["6000.7.0b10", "7000.0.0a21"]
    env:
      EDITOR_VERSION: ${{ matrix.editor }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: inputs.runner != 'self-hosted'
        with:
          python-version: "3.13"
      - run: python -m pip install -r Tools/requirements.txt
      - run: python Tools/csharp_style.py
      - run: python Tools/prepare.py --check
      - run: python -m unittest discover -s Tools -p "test_*.py"

      - name: Prepare hosted Unity CLI
        if: inputs.runner != 'self-hosted'
        shell: bash
        run: |
          # Reclaim space for the Editor archive, extracted Editor and Unity Library on this disposable VM.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libasound2t64 libglu1-mesa libgtk-3-0t64 libnss3 libxss1
          curl --fail --silent --show-error --location https://unity.com/install.sh -o "$RUNNER_TEMP/unity-install.sh"
          bash "$RUNNER_TEMP/unity-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Activate hosted Unity seat
        id: activate
        if: inputs.runner != 'self-hosted'
        shell: bash
        env:
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
        run: |
          : "${UNITY_LICENSE_SERIAL:?Configure an unattended Unity serial or select a licensed self-hosted runner}"
          unity license activate --non-interactive
      - name: Install hosted Editor
        if: inputs.runner != 'self-hosted'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/editors"
          unity editors install-path --set "$RUNNER_TEMP/editors"
          unity install "$EDITOR_VERSION" --accept-eula --yes --non-interactive
          unity terms accept "$EDITOR_VERSION" --yes --non-interactive
          echo "UNITY_HUB_EDITORS=$RUNNER_TEMP/editors" >> "$GITHUB_ENV"
      - if: ${{ !inputs.performance && !inputs.smoke_url }}
        run: python Tools/unity_matrix.py --versions "${{ matrix.editor }}"
      - if: inputs.performance
        run: python Tools/Benchmarks/steering.py --versions "${{ matrix.editor }}" --full-matrix
      - if: ${{ !inputs.smoke_url }}
        run: python Tools/unity_matrix.py --versions "${{ matrix.editor }}" --profile minimal --stages EditMode PlayMode
      - if: inputs.smoke_url
        env:
          KAIJU_INSTALL_URL: ${{ inputs.smoke_url }}
        run: python Tools/smoke_install.py --version "${{ matrix.editor }}"
      - name: Return hosted Unity seat
        if: always() && steps.activate.outcome == 'success'
        run: unity license return --yes --non-interactive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.smoke_url && 'consumer' || 'unity' }}-test-results-${{ matrix.editor }}
          path: |
            TestResults/${{ matrix.editor }}/
            TestResults/steering-benchmark/candidate/
